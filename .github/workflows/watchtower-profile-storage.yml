name: Watchtower encrypted profile storage

on:
  pull_request:
    paths:
      - .github/workflows/watchtower-profile-storage.yml
      - packages/app-desktop/bridge.ts
      - packages/app-desktop/app.ts
      - packages/app-desktop/joplinMain.ts
      - packages/app-desktop/main-html.ts
      - packages/app-desktop/services/plugins/PluginRunner*
      - packages/app-desktop/services/plugins/PluginScriptLoader*
      - packages/app-desktop/services/plugins/EncryptedPluginDataFileSystem*
      - packages/app-desktop/services/plugins/PluginDataFsProxy*
      - packages/app-desktop/services/plugins/PluginMessageRouter*
      - packages/app-desktop/services/plugins/PluginModulePolicy*
      - packages/app-desktop/services/plugins/plugin_index.*
      - packages/app-desktop/ElectronAppWrapper.ts
      - packages/app-desktop/commands/editProfileConfig.ts
      - packages/app-desktop/commands/startExternalEditing.ts
      - packages/app-desktop/commands/stopExternalEditing.ts
      - packages/app-desktop/commands/toggleExternalEditing.ts
      - packages/app-desktop/gui/NoteEditor/utils/contextMenu.ts
      - packages/app-desktop/gui/ResourceScreen.tsx
      - packages/app-desktop/gui/WindowCommandsAndDialogs/commands/revealResourceFile*
      - packages/lib/profileStorageBinding.ts
      - packages/lib/profileStorageBinding.test.ts
      - packages/lib/BaseApplication.ts
      - packages/lib/models/Setting.ts
      - packages/lib/services/plugins/PluginService.ts
      - packages/lib/services/plugins/loadPlugins.test.ts
      - packages/lib/services/ExternalEditWatcher*
      - packages/lib/services/ResourceEditWatcher/**
      - packages/lib/services/externalEditingPolicy.ts
      - packages/app-desktop/watchtower/desktop/**
      - packages/app-desktop/watchtower/profile/**
      - packages/app-desktop/watchtower/renderer/**
      - packages/app-desktop/watchtower/unlock/**
      - packages/app-desktop/gulpfile.ts
      - packages/app-desktop/tools/bundleJs.ts
      - packages/app-desktop/package.json
      - watchtower/sqlcipher/**
      - yarn.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: SQLCipher profile proof (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out Watchtower One
        uses: actions/checkout@v4

      - name: Check out pinned Signal SQLCipher binding source
        uses: actions/checkout@v4
        with:
          repository: signalapp/node-sqlcipher
          ref: 14e0f5e74e6bcd26d3462b48546473de5fd3a1fc
          path: node-sqlcipher

      - name: Enable Joplin SQLite compatibility
        shell: pwsh
        run: |
          $gypPath = 'node-sqlcipher/deps/sqlcipher/sqlcipher.gyp'
          $gyp = Get-Content -Raw -LiteralPath $gypPath
          $expected = "'SQLITE_DQS=0',"
          if (-not $gyp.Contains($expected)) {
            throw 'Pinned Signal source no longer has the reviewed SQLCipher compile flags'
          }
          $replacement = @"
          'SQLITE_DQS=3',
          'SQLITE_ENABLE_FTS3',
          'SQLITE_ENABLE_FTS3_PARENTHESIS',
          'SQLITE_ENABLE_FTS4',
          "@
          $gyp = $gyp.Replace($expected, $replacement.TrimEnd())
          Set-Content -LiteralPath $gypPath -Value $gyp

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Set up native-build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: pnpm
          cache-dependency-path: node-sqlcipher/pnpm-lock.yaml

      - name: Build the Joplin-compatible N-API prebuild
        working-directory: node-sqlcipher
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prebuildify --napi --target 22.14.0 --arch x64

      - name: Verify native compile options
        working-directory: node-sqlcipher
        shell: pwsh
        env:
          WATCHTOWER_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          $verificationScript = Join-Path $env:WATCHTOWER_REPOSITORY_ROOT 'watchtower/sqlcipher/verify-compatibility.cjs'
          $verification = node $verificationScript
          $verification
          $verification | Set-Content -LiteralPath sqlcipher-compile-options.json

      - name: Set up repository Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15'
          cache: yarn

      - name: Install repository dependencies
        run: |
          corepack enable
          corepack yarn install --immutable --mode=skip-build

      - name: Build Jest runtime workspace dependencies
        run: |
          corepack yarn workspace @joplin/lib exec node node_modules/@mapbox/node-pre-gyp/bin/node-pre-gyp install --fallback-to-build --directory node_modules/sqlite3
          corepack yarn workspaces foreach -R --from @joplin/lib -pt run build
          corepack yarn workspaces foreach -R --from @joplin/lib -pt run tsc
          corepack yarn workspace @joplin/app-desktop tsc

      - name: Run the encrypted profile proof
        shell: pwsh
        env:
          WATCHTOWER_SQLCIPHER_PREBUILD_ROOT: ${{ github.workspace }}\node-sqlcipher
        run: |
          corepack yarn watchtowerProfileStorageProof

      - name: Run the public plugin code-path proof
        run: |
          corepack yarn workspace @joplin/lib test --runInBand profileStorageBinding.test.js services/plugins/loadPlugins.test.js

      - name: Run the pre-profile unlock-window proof
        run: |
          corepack yarn workspace @joplin/app-desktop gulp bundleWatchtowerUnlockPreload
          corepack yarn workspace @joplin/app-desktop test --config watchtower/unlock/jest.unlock-proof.config.js --runInBand

      - name: Build the packaged Watchtower proof application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack yarn workspace @joplin/app-desktop build
          corepack yarn workspace @joplin/app-desktop electronRebuild
          $source = '${{ github.workspace }}\node-sqlcipher\prebuilds\win32-x64\@signalapp+sqlcipher.node'
          $destination = '${{ github.workspace }}\packages\app-desktop\node_modules\@signalapp\sqlcipher\prebuilds\win32-x64\@signalapp+sqlcipher.node'
          Copy-Item -LiteralPath $source -Destination $destination -Force
          corepack yarn workspace @joplin/app-desktop bundle
          corepack yarn workspace @joplin/app-desktop exec electron-builder --win dir --x64

      - name: Run the packaged create, close, scan, and reopen proof
        run: |
          corepack yarn workspace @joplin/app-desktop playwright test --config ../../watchtower/runtime-trace/playwright.first-run.config.ts --reporter=line

      - name: Upload packaged runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-packaged-first-run-win32-x64
          if-no-files-found: error
          path: |
            packages/app-desktop/test-results/watchtower-first-run/plaintext-scan.json
            packages/app-desktop/test-results/watchtower-first-run/usable-note-window.png
          retention-days: 14

      - name: Upload verified compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-sqlcipher-profile-win32-x64
          if-no-files-found: error
          path: |
            node-sqlcipher/prebuilds/win32-x64/@signalapp+sqlcipher.node
            node-sqlcipher/sqlcipher-compile-options.json
          retention-days: 14
