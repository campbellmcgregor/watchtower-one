<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
		>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Unlock Watchtower One</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: Inter, "Segoe UI", system-ui, sans-serif;
				background: #101828;
				color: #f8fafc;
			}
			* { box-sizing: border-box; }
			body {
				align-items: center;
				display: flex;
				justify-content: center;
				margin: 0;
				min-height: 100vh;
				padding: 32px;
			}
			main { width: min(100%, 360px); }
			.brand {
				color: #7dd3fc;
				font-size: 0.78rem;
				font-weight: 700;
				letter-spacing: 0.14em;
				margin: 0 0 14px;
				text-transform: uppercase;
			}
			h1 {
				font-size: 1.65rem;
				letter-spacing: -0.025em;
				margin: 0 0 8px;
			}
			.intro {
				color: #cbd5e1;
				font-size: 0.92rem;
				line-height: 1.5;
				margin: 0 0 24px;
			}
			label {
				display: block;
				font-size: 0.84rem;
				font-weight: 650;
				margin-bottom: 8px;
			}
			input {
				background: #182230;
				border: 1px solid #475467;
				border-radius: 8px;
				color: #fff;
				font: inherit;
				padding: 11px 12px;
				width: 100%;
			}
			input:focus {
				border-color: #38bdf8;
				outline: 3px solid rgb(56 189 248 / 25%);
			}
			.message {
				font-size: 0.82rem;
				line-height: 1.4;
				margin: 10px 0 0;
			}
			#error { color: #fda4af; }
			#progress { color: #bae6fd; }
			.actions {
				display: flex;
				gap: 10px;
				justify-content: flex-end;
				margin-top: 22px;
			}
			button {
				border: 0;
				border-radius: 8px;
				cursor: pointer;
				font: inherit;
				font-weight: 650;
				padding: 10px 16px;
			}
			#cancel {
				background: transparent;
				color: #e2e8f0;
			}
			#unlock {
				background: #38bdf8;
				color: #082f49;
			}
			button:disabled { cursor: wait; opacity: 0.65; }
		</style>
	</head>
	<body>
		<main>
			<p class="brand">Watchtower One</p>
			<h1>Unlock your vault</h1>
			<p class="intro">
				Your notes remain encrypted until your local vault opens.
				Nothing is sent to a Watchtower service.
			</p>
			<form id="unlock-form" autocomplete="off">
				<label for="passphrase">Vault passphrase</label>
				<input
					id="passphrase"
					name="passphrase"
					type="password"
					autocomplete="off"
					autofocus
					required
				>
				<p id="error" class="message" role="alert" hidden></p>
				<p id="progress" class="message" role="status" hidden>
					Unlocking securely. This may take about five seconds.
				</p>
				<div class="actions">
					<button id="cancel" type="button">Cancel</button>
					<button id="unlock" type="submit">Unlock</button>
				</div>
			</form>
		</main>
		<script src="./renderer.js"></script>
	</body>
</html>
